<!doctype html>
<html><head><meta charset="utf-8"><title>diag</title></head>
<body style="background:#111;color:#ddd;font-family:monospace;white-space:pre">
<pre id="out">running…</pre>
<script>
var out = [];
function p(s){ out.push(s); document.getElementById('out').textContent = out.join('\n'); }
async function t(name, fn){
  try { p(name + ' -> OK ' + await fn()); }
  catch(e){ p(name + ' -> ERR ' + e.message); }
}
(async function(){
  await t('A: fetch GET http://127.0.0.1:8765/info (cors)', async function(){
    var r = await fetch('http://127.0.0.1:8765/info');
    return r.status + ' ' + (await r.text()).slice(0, 60);
  });
  await t('B: fetch GET no-cors', async function(){
    var r = await fetch('http://127.0.0.1:8765/info', {mode:'no-cors'});
    return r.type + ' status=' + r.status;
  });
  await t('C: fetch POST no-cors', async function(){
    var r = await fetch('http://127.0.0.1:8765/send?host=127.0.0.1&port=9021', {method:'POST', mode:'no-cors', body: new Uint8Array([1,2,3])});
    return r.type + ' status=' + r.status;
  });
  await t('D: fetch GET http://localhost:8765/info', async function(){
    var r = await fetch('http://localhost:8765/info');
    return r.status;
  });
  document.title = 'DONE';
})();
</script>
</body></html>
