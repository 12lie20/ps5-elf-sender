<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS5 ELF Sender</title>
<style>
  :root {
    --line: #e3e6ea;
    --muted: #6b7280;
    --ink: #16191d;
    --ok: #2ea043;
  }
  body {
    font: 16px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0; padding: 0 1.25rem 4rem; color: var(--ink); background: #fff;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; display: block; height: 2px;
    background: linear-gradient(90deg, #16191d, #9aa3af 30%, rgba(154,163,175,0));
  }
  main { max-width: 30rem; margin: 0 auto; padding-top: 2.4rem; }
  .row { display: flex; gap: .6rem; flex-wrap: wrap; }
  button, .btn {
    font: inherit; font-size: .95rem; padding: .55rem 1.4rem; cursor: pointer; display: inline-block;
    border: 1px solid #d3d7de; border-radius: 6px; background: #fff; color: var(--ink);
    text-decoration: none; transition: background .12s, border-color .12s, color .12s, transform .06s;
  }
  button:hover, .btn:hover { background: #f4f5f7; border-color: #c3c8d0; }
  button:active, .btn:active { transform: translateY(1px); }
  button:focus-visible, .btn:focus-visible { outline: 2px solid #9bb7e6; outline-offset: 2px; }
  button[disabled] { opacity: .5; cursor: default; transform: none; }
  .primary { background: var(--ink); border-color: var(--ink); color: #fff; }
  .primary:hover { background: #2c3138; border-color: #2c3138; }
  .ext { font-size: .8em; opacity: .6; margin-left: .15em; }
  .note { margin: .9rem 0 0; font-size: .8rem; color: var(--muted); line-height: 1.7; }
  h2 {
    font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .09em;
    color: var(--muted); margin: 2.6rem 0 .2rem; padding-bottom: .5rem; border-bottom: 1px solid var(--line);
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: .75rem;
    padding: .5rem .5rem .5rem .6rem; margin: 0 -.6rem; border-radius: 6px;
    transition: background .12s;
  }
  li:hover { background: #fafbfc; }
  li .n {
    flex: 1 1 auto; font-size: .85rem; word-break: break-all;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  li .s { flex: 0 0 auto; font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  li button { flex: 0 0 auto; padding: .3rem .9rem; font-size: .85rem; }
  li:hover button { border-color: #b9bfc9; background: #f4f5f7; }
  #status { margin-top: 1.4rem; font-size: .9rem; color: #374151; min-height: 1.4em; display: flex; align-items: center; }
  .dot {
    width: 7px; height: 7px; border-radius: 50%; background: #d3d7de; flex: 0 0 auto;
    margin-right: .5rem; transition: background .2s;
  }
  .dot.busy { background: #d29922; animation: pulse 1.1s ease-in-out infinite; }
  .dot.ok { background: var(--ok); }
  .dot.err { background: #d1242f; }
  @keyframes pulse { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }
  .spin {
    display: inline-block; width: .8em; height: .8em; margin-right: .4em; vertical-align: -.08em;
    border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
    animation: spin .65s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg) } }
  pre {
    margin: 1.2rem 0 0; padding: .75rem; background: #f6f7f9; border: 1px solid var(--line); border-radius: 6px;
    font-size: .8rem; text-align: left; white-space: pre-wrap; word-break: break-word; max-height: 40vh; overflow: auto;
  }
</style>
</head>
<body>
<main>
  <div class="row">
    <button class="primary" id="send">Send to PS5</button>
    <a class="btn" id="jb" href="https://soniciso1.github.io/relapse/relapse.html">JB 13.60<span class="ext">&#8599;</span></a>
  </div>
  <p class="note">Wait for &ldquo;elfldr is listening on port 9021&rdquo;, then press Send.</p>

  <h2>Payloads</h2>
  <ul id="tools"></ul>
  <p class="note">On 13.60: kstuff first, then ShadowMountPlus. etaHEN 2.5B targets 8.40&ndash;10.01,
    it may not run on 13.60.</p>

  <div id="status"><span class="dot" id="dot"></span><span id="statusText"></span></div>
  <pre id="reply" hidden></pre>
</main>

<script>
(function () {
  var BASE = 'https://12lie20.github.io/ps5-elf-sender/';

  // Loaded from the console itself: elfldr on 127.0.0.1:9021 pulls the file
  // from the url given in ?uri=
  var MAIN = { file: 'crlr69.elf', size: 236880 };

  var TOOLS = [
    { file: MAIN.file, size: MAIN.size },
    { file: 'payloads/kstuff.elf', size: 1737080 },
    { file: 'payloads/shadowmountplus.elf', size: 2498376 },
    { file: 'payloads/etaHEN-2.5B.bin', size: 4678728 },
    { file: 'payloads/ftpsrv-ps5.elf', size: 191864 },
    { file: 'payloads/websrv-ps5.elf', size: 1597864 },
    { file: 'payloads/elfldr-ps5.elf', size: 394480 }
  ];

  var send = document.getElementById('send');
  var statusText = document.getElementById('statusText');
  var dot = document.getElementById('dot');
  var reply = document.getElementById('reply');
  var list = document.getElementById('tools');

  function show(text, state) {
    statusText.textContent = text;
    dot.className = 'dot' + (state ? ' ' + state : '');
  }

  function bytes(n) {
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(0) + ' KiB';
    return (n / 1048576).toFixed(1) + ' MiB';
  }

  function load(file, button) {
    var url = BASE + file;
    var target = 'http://127.0.0.1:9021/?uri=' + encodeURIComponent(url);
    var name = file.split('/').pop();
    var label = button ? button.innerHTML : send.innerHTML;

    function busy() {
      if (button) {
        button.disabled = true;
      } else {
        send.disabled = true;
        send.innerHTML = '<span class="spin"></span>Sending…';
      }
      show('Sending ' + name + '…', 'busy');
    }

    function markSent() {
      if (button) {
        button.disabled = false;
        button.textContent = 'Sent';
        setTimeout(function () { button.textContent = 'Send'; }, 1400);
      } else {
        send.innerHTML = 'Sent';
        setTimeout(function () { send.innerHTML = label; send.disabled = false; }, 1400);
      }
    }

    function idle() {
      if (button) {
        button.disabled = false;
      } else {
        send.innerHTML = label;
        send.disabled = false;
      }
    }

    busy();

    var done = false;
    function finish(text, state) {
      if (done) return;
      done = true;
      clearTimeout(timer);
      show(text, state);
      markSent();
    }

    // The loader holds the socket open while the payload runs, so a reply may
    // never come back. A silent request still means it went through.
    var timer = setTimeout(function () {
      finish('Sent ' + name + '.', 'ok');
    }, 3000);

    fetch(target, { mode: 'cors', cache: 'no-store' })
      .then(function (res) {
        return res.text().then(function (body) {
          return { ok: res.ok, status: res.status, body: body };
        });
      })
      .then(function (res) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        markSent();
        show(res.ok ? 'Sent ' + name + '.' : 'Loader replied with HTTP ' + res.status + '.', res.ok ? 'ok' : 'err');
        if (res.body) {
          reply.hidden = false;
          reply.textContent = res.body;
        }
      })
      .catch(function () {
        // https page -> http://127.0.0.1 is mixed content, the browser blocks
        // the fetch. A top level navigation is not subject to that rule.
        if (done) return;
        done = true;
        clearTimeout(timer);
        idle();
        var w = null;
        try { w = window.open(target, '_blank'); } catch (e) {}
        if (w) {
          show('Sent ' + name + ' — check the new tab.', 'ok');
        } else {
          show('Opening the loader…', 'busy');
          window.location.href = target;
        }
      });
  }

  send.addEventListener('click', function () {
    load(MAIN.file, null);
  });

  TOOLS.forEach(function (tool) {
    var li = document.createElement('li');
    var name = document.createElement('span');
    name.className = 'n';
    name.textContent = tool.file.split('/').pop();
    var size = document.createElement('span');
    size.className = 's';
    size.textContent = bytes(tool.size);
    var button = document.createElement('button');
    button.textContent = 'Send';
    button.addEventListener('click', function () {
      load(tool.file, button);
    });
    li.appendChild(name);
    li.appendChild(size);
    li.appendChild(button);
    list.appendChild(li);
  });
})();
</script>
</body>
</html>
