<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crlr69.elf</title>
<style>
  body {
    font: 16px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0; padding: 3rem 1.25rem; color: #16191d; background: #fff;
  }
  main { max-width: 28rem; margin: 0 auto; text-align: center; }
  h1 { font-size: 1.3rem; font-weight: 600; margin: 0; word-break: break-all; }
  p { color: #6b7280; font-size: .9rem; margin: .35rem 0 2rem; }
  button { font: inherit; padding: .6rem 1.5rem; cursor: pointer; }
  button[disabled] { opacity: .55; cursor: default; }
  #status { margin-top: 1.1rem; font-size: .9rem; color: #374151; min-height: 1.4em; }
  pre {
    margin: 1.5rem 0 0; padding: .75rem; background: #f6f7f9; border: 1px solid #e5e7eb;
    font-size: .8rem; text-align: left; white-space: pre-wrap; word-break: break-word; max-height: 40vh; overflow: auto;
  }
</style>
</head>
<body>
<main>
  <h1>crlr69.elf</h1>
  <p>236880 bytes &middot; PS5 payload</p>
  <button id="send">Send to PS5</button>
  <div id="status"></div>
  <pre id="reply" hidden></pre>
</main>

<script>
(function () {
  // The payload the console will pull over the network.
  var PAYLOAD_URL = 'https://12lie20.github.io/ps5-elf-sender/crlr69.elf';

  // elfldr on the console: http://127.0.0.1:9021/?uri=<encoded payload url>
  var LOADER_URL = 'http://127.0.0.1:9021/?uri=' + encodeURIComponent(PAYLOAD_URL);

  var send = document.getElementById('send');
  var status = document.getElementById('status');
  var reply = document.getElementById('reply');

  function show(text) {
    status.textContent = text;
  }

  send.addEventListener('click', function () {
    send.disabled = true;
    show('Sending…');
    var done = false;
    function finish(text) {
      if (done) return;
      done = true;
      clearTimeout(timer);
      show(text);
      send.disabled = false;
    }

    // The loader keeps the socket open while the payload runs, so a reply may
    // never arrive. Treat a silent request as a successful send.
    var timer = setTimeout(function () {
      finish('Sent. The payload should be running on the console now.');
    }, 3000);

    fetch(LOADER_URL, { mode: 'cors', cache: 'no-store' })
      .then(function (res) {
        return res.text().then(function (body) {
          return { ok: res.ok, status: res.status, body: body };
        });
      })
      .then(function (res) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        send.disabled = false;
        show(res.ok ? 'Sent.' : 'Loader replied with HTTP ' + res.status + '.');
        if (res.body) {
          reply.hidden = false;
          reply.textContent = res.body;
        }
      })
      .catch(function () {
        // Blocked by the browser (https page -> http://127.0.0.1 is mixed
        // content). A top level navigation is not subject to that rule.
        if (done) return;
        done = true;
        clearTimeout(timer);
        show('Opening the loader…');
        window.location.href = LOADER_URL;
      });
  });

  // Temporary test hook: ?auto=1 sends without a click.
  if (/[?&]auto=1/.test(location.search)) {
    send.click();
  }
})();
</script>
</body>
</html>
